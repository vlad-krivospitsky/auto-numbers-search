{% extends 'base.html' %}

{% block title %}Вхід у систему{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center fw-bold mb-4">Вхід у систему</h3>

                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Невірне ім'я користувача або пароль.
                    </div>
                {% endif %}

                <form method="post" action="{% url 'accounts:login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Ім'я користувача</label>
                        <input type="text" name="username" id="id_username" class="form-control" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">Пароль</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">Увійти</button>
                    </div>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <span class="text-muted">Ще не маєте акаунту?</span>
                    <a href="{% url 'accounts:signup' %}" class="text-decoration-none fw-semibold">Зареєструватися</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
